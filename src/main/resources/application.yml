spring:
  application:
    name: knowledge-base
  profiles:
    active: dev,private
  data:

    redis:
     host: localhost
     port: 6379
     password: 123456
     database: 0
     timeout: 10s
     repositories:
        enabled: false
     lettuce:
         timeout: 50000ms
         pool:
          # 连接池最大连接数
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: tiancaixiaoeyu
  datasource:
    url: jdbc:mysql://localhost:3306/knowledge_base
    username: root
    password: tiancaixiaoeyu
    driver-class-name: com.mysql.cj.jdbc.Driver
